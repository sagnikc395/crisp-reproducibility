[project]
name = "crisp-reproducibility"
version = "0.1.0"
description = "Reproduction of CRISP: Persistent Concept Unlearning via Sparse Autoencoders (ACL 2026)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.0.0",
    "datasets>=5.0.0",
    "huggingface-hub>=0.30.0",
    "numpy>=2.0.0",
    "peft>=0.19.1",
    "pyyaml>=6.0",
    "safetensors>=0.4.5",
    "tokenizers>=0.22.2",
    "torch>=2.13.0",
    "tqdm>=4.66.0",
    "transformers>=5.14.1",
]

[project.optional-dependencies]
judge = ["anthropic>=0.40.0"]
sweep = ["optuna>=4.0.0"]
dev = ["pytest>=8.0.0"]
mlx = [
    "mlx-lm>=0.28.0",
]

[project.scripts]
crisp = "crisp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crisp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
