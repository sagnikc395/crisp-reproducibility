# Evaluation-only config for local Apple-silicon inference via mlx-lm.
# Mirrors gemma2-2b_cyber.yaml; `crisp select`/`train` reject backend: mlx.
run_name: gemma2-2b_cyber_mlx

model:
  name: google/gemma-2-2b
  backend: mlx
  mlx_name: mlx-community/gemma-2-2b-4bit

data:
  domain: cyber
  max_seq_len: 256

eval:
  split: test
  # 4-bit weights leave plenty of headroom; only the last position's logits are
  # materialised, so the batch is bounded by activations rather than the vocab.
  mcq_batch_size: 16
  gen_max_new_tokens: 50
