# Evaluation-only config for local Apple-silicon inference via mlx-lm.
# Mirrors gemma2-2b_bio.yaml; `crisp select`/`train` reject backend: mlx.
run_name: gemma2-2b_bio_mlx

model:
  name: google/gemma-2-2b
  backend: mlx
  mlx_name: mlx-community/gemma-2-2b-4bit

data:
  domain: bio
  # Gated: request access on the dataset page and export HF_TOKEN.
  target_corpus_repo: cais/wmdp-bio-forget-corpus
  retain_corpus_repo: cais/wmdp-corpora
  max_seq_len: 256

eval:
  split: test
  mcq_batch_size: 16
  gen_max_new_tokens: 50
