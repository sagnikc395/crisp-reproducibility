# CRISP best configuration for Gemma-2-2B on WMDP-Bio (Appendix F).
run_name: gemma2-2b_bio

model:
  name: google/gemma-2-2b
  sae_layers: [4, 6, 8, 10, 12, 14]
  lora_layers: [3, 4, 5, 6, 7, 8, 9]

sae:
  source: gemma_scope
  repo_id: google/gemma-scope-2b-pt-res
  filename_template: auto   # picks the release with average L0 nearest l0_target
  l0_target: 100
  width: 16384

data:
  domain: bio
  # Corpora are read from data/wmdp/. Run `crisp fetch --domain bio` once to
  # materialise them (the bio forget corpus is gated: request access, then put
  # HF_TOKEN in .env).
  max_target_docs: 5000
  max_retain_docs: 5000
  max_chars: 1000
  max_seq_len: 256

selection:
  top_k: 30
  tau: 3.0
  max_docs: 500
  batch_size: 4

train:
  steps: 200
  batch_size: 2
  lr: 4.0e-5
  lora_rank: 8
  lambda_scale: 30.0
  beta: 0.99
  gamma: 0.01

eval:
  split: test
  mcq_batch_size: 4
  gen_max_new_tokens: 50
  # The rater dominates the wall clock: 100 prefixes x 2 passes, and a Thinking
  # checkpoint spends most of its 2048-token budget before emitting the rating.
  # Decoding a 4B model is bandwidth-bound, so a wider batch costs almost
  # nothing per step and divides the batch count instead. 16 puts the KV cache
  # at ~5 GB on top of ~8 GB of weights -- comfortable on a 24 GB card, drop to
  # 4 if the rater OOMs on something smaller.
  judge_batch_size: 16
