# Tiny end-to-end pipeline check. No gated downloads, CPU-friendly.
run_name: smoke

model:
  name: hf-internal-testing/tiny-random-LlamaForCausalLM
  sae_layers: [1]
  lora_layers: [0, 1]
  device: cpu
  dtype: float32

sae:
  source: random
  width: 512

data:
  domain: bio
  target_corpus: data/smoke/target.jsonl
  retain_corpus: data/smoke/retain.jsonl
  max_target_docs: 32
  max_retain_docs: 32
  max_seq_len: 64

selection:
  top_k: 8
  tau: 1.0
  max_docs: 16
  batch_size: 4
  cache_dir: artifacts/features_smoke

train:
  steps: 3
  batch_size: 2
  lr: 1.0e-4
  lora_rank: 4
  lambda_scale: 30.0
  save_dir: artifacts/runs_smoke

# There is no eval block on purpose: the smoke model has random weights, so its
# fluency/concept scores are noise either way. Always pass --no-judge here --
# without it the run downloads an 8 GB rater and spends ~100 minutes scoring
# gibberish, which is the slowest possible way to learn the pipeline is wired
# up. The judge path gets its real exercise from the gemma2-2b configs.
eval:
  mmlu_max_per_subject: 2
  judge_batch_size: 16
